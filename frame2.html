<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Upgrade</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="frame2.css">
</head>
<body>
    <!-- 1. The Audio tag must have id="bgMusic" -->
<audio id="bgMusic" src="audio.wav" loop></audio>

    <div class="launch-container">
        <div class="glass-card">
            <div class="status-bar">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="status-text">FOR MY FAVOURITE PERSON</span>
            </div>

            <h1 class="welcome-text">The wait ends here, <span class="highlight">DEEVU</span>.</h1>
            
            <p class="sub-text">A lot has happened last year, but some things only get better with time. <br> This is my way of showing you how much you mean to me.</p>

            <!-- A visual element that pulses with the "vibe" -->
            <div class="vibe-visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
                <button class="launch-btn" id="launchBtn" onclick="launchExperience()">
                    Unwrap the surprise ➜
                </button>
        </div>
    </div>

    <script src="frame2.js"></script>
</body>
</html>
